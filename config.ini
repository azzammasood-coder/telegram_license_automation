; GLOBAL holds settings shared across all states rather than one state's templates.
[GLOBAL]
; Blank 8-up Teslin sheet shared by any non-perforated state (California-style
; perforated states instead use their own per-state UpsheetPSD below, since the
; perforation is baked into that state's own sheet).
; NonPerforatedUpsheetPSD=C:\path\to\Non-Perforated UPSHEET.psd

[CA]
FrontPSD=C:\Users\pc\Documents\freelance\dynamic template generation\templates\CA\CA FRONT.psd
BackPSD=C:\Users\pc\Documents\freelance\dynamic template generation\templates\CA\CA BACK.psd
FrontUVPSD=C:\Users\pc\Documents\freelance\dynamic template generation\templates\CA\CA FRONT UV.psd
FrontLaserPSD=C:\Users\pc\Documents\freelance\dynamic template generation\templates\CA\CA FRONT LASER.psd
BackLaserPSD=C:\Users\pc\Documents\freelance\dynamic template generation\templates\CA\CA BACK LASER.psd
HologramPSD=C:\Users\pc\Documents\freelance\dynamic template generation\templates\CA\CA Hologram.psd
Perforated=true
UpsheetPSD=C:\Users\pc\Documents\freelance\dynamic template generation\templates\CA\CA UPSHEET.psd

[MA]
FrontPSD=C:\Users\pc\Documents\freelance\dynamic template generation\templates\MA\Massachusetts MA 2016 Front.psd
FrontRaisedPSD=C:\Users\pc\Documents\freelance\dynamic template generation\templates\MA\Massachusetts MA 2016 Front Raised.psd
BackPSD=C:\Users\pc\Documents\freelance\dynamic template generation\templates\MA\Massachusetts MA 2016 Back.psd
; MA upsheet template not yet provided; non-perforated so it would use
; [GLOBAL] NonPerforatedUpsheetPSD once that sheet exists.
Perforated=false